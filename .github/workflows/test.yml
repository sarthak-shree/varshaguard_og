name: VARSHAGUARD tests

on:
  push:
  pull_request:

# Tests are read-only. Any workflow that intentionally publishes artifacts or updates
# repository contents must declare its own narrowly scoped permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q
