name: Bihar Live regression tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'models/bihar_flood_24h_rainfall_model.pkl.b64'
      - 'frontend/bihar-live.html'
      - 'requirements.txt'
  push:
    branches: [main]

jobs:
  test-bihar-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile backend/bihar_live/ml_engine.py backend/app.py
      - run: cd backend/bihar_live && python test_ml_engine.py
