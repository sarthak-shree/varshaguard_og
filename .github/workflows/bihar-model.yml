name: Bihar model validation

on:
  workflow_dispatch:

jobs:
  validate-bihar-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate model pipeline code
        run: python -m pytest backend/tests/test_bihar_real_model.py -q
      - name: Check local training inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          rainfall = Path('/mnt/data/bihar_historical_rainfall_ml_ready.csv')
          if not rainfall.exists():
              print('Local uploaded rainfall file is not present in GitHub Actions; skipping training artifact generation.')
          else:
              import subprocess
              subprocess.run(['python','-m','backend.bihar_live.bihar_real_model'], check=True)
          PY
