<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sign in securely to VarshaGuard.">
<title>Sign in — VarshaGuard</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f31;--line:#29415a;--text:#eff7ff;--muted:#a8bdd0;--accent:#58d7c2;--danger:#ffaaa5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#153c50 0,transparent 42%),radial-gradient(ellipse at 85% 90%,#172b4b 0,transparent 42%),var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
.card{width:min(100%,460px);padding:clamp(24px,6vw,40px);border:1px solid var(--line);border-radius:24px;background:rgba(16,31,49,.94);box-shadow:0 24px 80px #0005}
.brand{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:800}.brand span{color:#fff}h1{font-size:32px;line-height:1.15;margin:14px 0 8px}p{color:var(--muted);margin:0 0 24px}.btn,input{width:100%;min-height:48px;border-radius:12px;font:inherit}.btn{border:1px solid var(--line);background:#172b40;color:var(--text);font-weight:700;cursor:pointer;margin:8px 0}.btn.primary{background:var(--accent);color:#06201e;border-color:transparent}.btn:disabled{opacity:.6;cursor:wait}input{background:#091727;border:1px solid var(--line);color:var(--text);padding:0 14px;margin:6px 0 10px}label{display:block;font-size:14px;font-weight:650;margin-top:14px}.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:12px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}#authStatus{min-height:24px;margin:12px 0 0;font-size:13px;color:var(--accent);overflow-wrap:anywhere}#authStatus[data-error="true"]{color:var(--danger)}.foot{font-size:12px;margin:20px 0 0}.otp-row{display:flex;gap:8px}.otp-row input{flex:1;min-width:0}.otp-row .btn{width:130px;flex-shrink:0}a{color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">VARSHA<span>GUARD</span> ↗</div>
  <h1>Sign in to your dashboard</h1>
  <p>Use Google or verify your phone number with a one-time SMS code. No password required.</p>
  <button class="btn primary" id="googleLogin" type="button">Continue with Google</button>
  <div class="divider">OR USE PHONE OTP</div>
  <label for="phoneNumber">Phone number</label>
  <input id="phoneNumber" type="tel" autocomplete="tel" placeholder="+919876543210" inputmode="tel">
  <button class="btn" id="sendOtp" type="button">Send OTP by SMS</button>
  <label for="otpCode">Six-digit OTP</label>
  <div class="otp-row"><input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" hidden><button class="btn primary" id="verifyOtp" type="button" hidden>Verify OTP</button></div>
  <div id="recaptcha-container"></div>
  <p id="authStatus" role="status" aria-live="polite">Loading secure sign-in…</p>
  <p class="foot">Prototype access only. Configure Firebase Authentication before enabling sign-in. Phone OTP is delivered by SMS, not WhatsApp.</p>
</main>
<script type="module" src="/auth.js"></script>
</body>
</html>
