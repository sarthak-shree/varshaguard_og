<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARSHAGUARD — Bihar Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bihar-live { max-width: 1320px; margin: 0 auto; padding: 22px; }
        .controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr auto; gap: 10px; margin-bottom: 18px; }
        .controls input, .controls select, .controls button { min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel2); color: var(--text); font: inherit; }
        .controls button { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; cursor: pointer; }
        .live-meta { margin: -8px 0 14px; color: var(--muted); font-size: 12px; }
        .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .summary-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
        .summary-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .55px; }
        .summary-card .value { margin-top: 4px; font: 700 28px var(--mono); }
        .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; }
        th { background: var(--panel2); color: var(--muted); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .45px; }
        td strong { font-size: 13px; }
        .badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font: 10px var(--mono); font-weight: 700; }
        .danger { background: #fee2e2; color: #b91c1c; }
        .warning { background: #fef3c7; color: #a16207; }
        .normal { background: #dcfce7; color: #166534; }
        .trend-up { color: #b91c1c; }
        .trend-down { color: #0369a1; }
        .trend-steady { color: var(--muted); }
        .error { margin: 14px 0; padding: 11px 12px; background: #fff3f2; border: 1px solid #e3b0ad; color: #8d332f; border-radius: 5px; }
        @media (max-width: 900px) { .controls { grid-template-columns: 1fr 1fr; } .summary { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 620px) { .controls, .summary { grid-template-columns: 1fr; } .bihar-live { padding: 14px; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div>
            <h1><a href="/">VARSHA<span>GUARD &#8623;</span></a></h1>
            <p><span>BIHAR LIVE</span> &bull; Current river observation feed</p>
        </div>
        <div class="topbar-actions">
            <a class="prototype-badge" href="/">MAIN DASHBOARD</a>
        </div>
    </header>

    <main class="bihar-live">
        <section class="panel">
            <div class="controls">
                <input id="stationSearch" type="search" placeholder="Station, river or district">
                <select id="districtSelect"><option value="">All Bihar</option></select>
                <select id="levelSelect"><option value="">All levels</option><option value="danger">Danger</option><option value="warning">Warning</option><option value="normal">Normal</option></select>
                <button id="refreshButton" type="button">↻ REFRESH</button>
            </div>
            <div class="live-meta" id="liveMeta">Fetching latest Bihar station data…</div>
            <div id="errorBox" class="error" hidden></div>
        </section>

        <section class="summary">
            <div class="summary-card"><div class="label">Monitored Stations</div><div class="value" id="stationCount">—</div></div>
            <div class="summary-card"><div class="label">Danger Level</div><div class="value" id="dangerCount">—</div></div>
            <div class="summary-card"><div class="label">Warning Level</div><div class="value" id="warningCount">—</div></div>
            <div class="summary-card"><div class="label">Rising Trend 1h</div><div class="value" id="risingCount">—</div></div>
        </section>

        <section class="panel table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Station</th>
                        <th>District</th>
                        <th>Level</th>
                        <th>Threshold</th>
                        <th>Trend</th>
                    </tr>
                </thead>
                <tbody id="stationsBody">
                    <tr><td colspan="5">Loading live observations…</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        let stationData = [];

        const els = {
            body: document.getElementById('stationsBody'),
            search: document.getElementById('stationSearch'),
            district: document.getElementById('districtSelect'),
            level: document.getElementById('levelSelect'),
            refresh: document.getElementById('refreshButton'),
            meta: document.getElementById('liveMeta'),
            error: document.getElementById('errorBox'),
            count: document.getElementById('stationCount'),
            danger: document.getElementById('dangerCount'),
            warning: document.getElementById('warningCount'),
            rising: document.getElementById('risingCount')
        };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }

        function classify(station) {
            const level = Number(station.water_level_m);
            const danger = Number(station.danger_level_m);
            const warning = Number(station.warning_level_m);
            if (Number.isFinite(danger) && level >= danger) return 'danger';
            if (Number.isFinite(warning) && level >= warning) return 'warning';
            return 'normal';
        }

        function trendClass(value) {
            if (value > 0) return 'trend-up';
            if (value < 0) return 'trend-down';
            return 'trend-steady';
        }

        function trendLabel(value) {
            if (value > 0) return '↑ rising';
            if (value < 0) return '↓ falling';
            return '→ steady';
        }

        function populateDistricts() {
            const districts = [...new Set(stationData.map(item => item.district).filter(Boolean))].sort();
            els.district.innerHTML = '<option value="">All Bihar</option>' + districts.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        }

        function render() {
            const query = els.search.value.trim().toLowerCase();
            const district = els.district.value;
            const level = els.level.value;
            const filtered = stationData.filter(station => {
                const haystack = `${station.station} ${station.river} ${station.district}`.toLowerCase();
                return (!query || haystack.includes(query)) && (!district || station.district === district) && (!level || classify(station) === level);
            });

            els.count.textContent = filtered.length;
            els.danger.textContent = filtered.filter(s => classify(s) === 'danger').length;
            els.warning.textContent = filtered.filter(s => classify(s) === 'warning').length;
            els.rising.textContent = filtered.filter(s => Number(s.rise_1h_m) > 0).length;

            if (!filtered.length) {
                els.body.innerHTML = '<tr><td colspan="5">No stations match the current filters.</td></tr>';
                return;
            }

            els.body.innerHTML = filtered.map(station => {
                const levelClass = classify(station);
                const badgeText = levelClass === 'danger' ? 'DANGER' : levelClass === 'warning' ? 'WARNING' : 'NORMAL';
                const threshold = levelClass === 'danger' ? station.danger_level_m : station.warning_level_m;
                const rise = Number(station.rise_1h_m || 0);
                return `
                    <tr>
                        <td><strong>${escapeHtml(station.station)}</strong><br><span>${escapeHtml(station.river)}</span></td>
                        <td>${escapeHtml(station.district)}</td>
                        <td>${Number(station.water_level_m).toFixed(2)} m</td>
                        <td><span class="badge ${levelClass}">${badgeText}</span> ${Number.isFinite(Number(threshold)) ? Number(threshold).toFixed(2) + ' m' : '—'}</td>
                        <td class="${trendClass(rise)}">${trendLabel(rise)}</td>
                    </tr>`;
            }).join('');
        }

        async function loadStations() {
            els.error.hidden = true;
            els.meta.textContent = 'Fetching latest Bihar station data…';
            try {
                const response = await fetch('/api/bihar-live/stations?ts=' + Date.now(), { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
                const data = await response.json();
                if (!response.ok || data.success === false) throw new Error(data.error || 'Live station feed failed');
                stationData = Array.isArray(data.stations) ? data.stations : [];
                populateDistricts();
                render();
                els.meta.textContent = `Live source: ${data.source || 'CWC/India-WRIS'} • Backend fetched just now • refreshes every 15 minutes`;
            } catch (error) {
                els.error.textContent = error.message;
                els.error.hidden = false;
                els.meta.textContent = 'Live feed unavailable.';
            }
        }

        els.search.addEventListener('input', render);
        els.district.addEventListener('change', render);
        els.level.addEventListener('change', render);
        els.refresh.addEventListener('click', loadStations);

        loadStations();
        setInterval(loadStations, 15 * 60 * 1000);
    </script>
</body>
</html>
